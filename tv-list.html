<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope - TV Shows</title>
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/moviesList.css">
</head>
<body data-page="tvshows">

    <div id="header-placeholder"></div>

    <main>
        <div class="list-page">
            <aside class="filters-sidebar">
                <h3>Filters</h3>
                <div class="filters-content">
                    <p class="filters-placeholder">Filters coming soon.</p>
                </div>
            </aside>

            <section class="list-main">
                <h1 class="list-title"></h1>
                <p class="list-subtitle">Showing TV shows produced in India — Telugu, Hindi, Tamil, Kannada, Malayalam, and more.</p>
                <div class="movie-grid-full"></div>
                <div class="load-more-wrapper">
                    <button class="btn-load-more">Load More</button>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="./src/js/tvList.js"></script>
</body>
</html>
