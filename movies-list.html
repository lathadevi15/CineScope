<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope - Movies</title>
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/moviesList.css">
</head>
<body data-page="movies">

    <div id="header-placeholder"></div>

    <main>
        <div class="list-page">
            <aside class="filters-sidebar">
                <h3>Filters</h3>
                <div class="filters-content">
   <form>
    <div class="filter-option">
        <input type="radio" name="movies-filters" id="popularity-descending" checked>
        <label for="popularity-descending">Popularity Descending</label>
    </div>
    <div class="filter-option">
        <input type="radio" name="movies-filters" id="popularity-ascending">
        <label for="popularity-ascending">Popularity Ascending</label>
    </div>
    <div class="filter-option">
        <input type="radio" name="movies-filters" id="rating-descending">
        <label for="rating-descending">Rating Descending</label>
    </div>
    <div class="filter-option">
        <input type="radio" name="movies-filters" id="rating-ascending">
        <label for="rating-ascending">Rating Ascending</label>
    </div>
    <div class="filter-option">
        <input type="radio" name="movies-filters" id="release-date-descending">
        <label for="release-date-descending">Release Date Descending</label>
    </div>
    <div class="filter-option">
        <input type="radio" name="movies-filters" id="release-date-ascending">
        <label for="release-date-ascending">Release Date Ascending</label>
    </div>
   </form>

   <div class="release-date-filter">
       <h4>Release Dates</h4>

       <div class="filter-option">
           <input type="checkbox" id="search-all-releases" checked>
           <label for="search-all-releases">Search all releases?</label>
       </div>

       <div class="date-range-fields">
           <label for="release-from" class="date-label">From</label>
           <input type="date" id="release-from" disabled>

           <label for="release-to" class="date-label">To</label>
           <input type="date" id="release-to" disabled>
       </div>
   </div>
   <div class="genre-filter">
    <h4>Genres</h4>
    <button class="genre-btn" data-genre-id="28">Action</button>
    <button class="genre-btn" data-genre-id="12">Adventure</button>
    <button class="genre-btn" data-genre-id="35">Comedy</button>
    <button class="genre-btn" data-genre-id="80">Crime</button>
    <button class="genre-btn" data-genre-id="18">Drama</button>
    <button class="genre-btn" data-genre-id="99">Documentary</button>
    <button class="genre-btn" data-genre-id="14">Fantasy</button>
    <button class="genre-btn" data-genre-id="10751">Family</button>
    <button class="genre-btn" data-genre-id="27">Horror</button>
    <button class="genre-btn" data-genre-id="9648">Mystery</button>
    <button class="genre-btn" data-genre-id="10749">Romance</button>
    <button class="genre-btn" data-genre-id="878">Science Fiction</button>
    <button class="genre-btn" data-genre-id="53">Thriller</button>
    <button class="genre-btn" data-genre-id="10752">War</button>
    <button class="genre-btn" data-genre-id="37">Western</button>
</div>
</div>
            </aside>

            <section class="list-main">
                <h1 class="list-title"></h1>
                <div class="movie-grid-full"></div>
                <div class="load-more-wrapper">
                    <button class="btn-load-more">Load More</button>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="./src/js/moviesList.js"></script>
</body>
</html>
